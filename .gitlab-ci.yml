# GitLab CI – mirrors the GitHub Actions CI/CD features
#
# Stages
# ──────
# lint     – ruff (linter + formatter check) + mypy
# test     – pytest with coverage across a Python version matrix
# security – pip-audit dependency vulnerability scan
# publish  – build sdist/wheel and upload to PyPI (version tags only)

stages:
  - lint
  - test
  - security
  - publish

default:
  image: python:3.12-slim
  before_script:
    - pip install --upgrade pip

# ── 1. Lint & type-check ──────────────────────────────────────────────────
lint:
  stage: lint
  script:
    - pip install ruff mypy
    - ruff check .
    - ruff format --check .
    - mypy src/

# ── 2. Test matrix ────────────────────────────────────────────────────────
test:
  stage: test
  needs: [lint]    # only run when linting passes

  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12"]

  image: python:${PYTHON_VERSION}-slim

  script:
    - pip install -e ".[dev]"
    - pytest --cov=calculator --cov-report=term-missing --cov-report=xml

  # Extract the total coverage % for the GitLab merge-request coverage widget
  coverage: '/^TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+%)/'

  artifacts:
    when: always
    reports:
      # Enables the coverage visualisation diff in merge requests
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ── 3. Dependency vulnerability scan ─────────────────────────────────────
security:
  stage: security

  script:
    - pip install pytest pytest-cov ruff mypy pip-audit
    - pip-audit --strict

# ── 4. Publish to PyPI ────────────────────────────────────────────────────
# Triggered only when a version tag (e.g. v1.2.3) is pushed.
# Requires a PYPI_TOKEN CI/CD variable set in:
#   GitLab → Settings → CI/CD → Variables
publish:
  stage: publish

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

  script:
    - pip install build twine
    - python -m build
    - twine upload dist/*

  variables:
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $PYPI_TOKEN   # masked variable – never printed in logs
