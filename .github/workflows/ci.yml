# CI – runs on every push / pull-request to main
#
# Jobs
# ────
# lint     – ruff (linter + formatter check) + mypy
# test     – pytest with coverage across a Python version matrix
# coverage – uploads the XML report to Codecov (only from Python 3.12)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: pip install ruff mypy

      - name: ruff – lint
        run: ruff check .

      - name: ruff – format check
        run: ruff format --check .

      - name: mypy – type check
        run: mypy src/

  # ── 2. Test matrix ────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint          # only run tests when linting passes

    strategy:
      fail-fast: false   # keep running other versions if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=calculator --cov-report=xml --cov-report=term-missing

      # Upload coverage only once (from the latest Python version)
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false   # don't fail CI if Codecov is unreachable
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
