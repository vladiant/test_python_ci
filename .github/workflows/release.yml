# Release – triggered by pushing a version tag (e.g. v1.2.3)
#
# Jobs
# ────
# build   – builds sdist + wheel and attaches them as artifacts
# publish – uploads the artifacts to PyPI via OIDC trusted publishing
#           (no long-lived API token needed; configure trusted publisher
#            in PyPI project settings → Publishing → Add publisher)

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # ── 1. Build distribution packages ───────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── 2. Publish to PyPI ────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release    # maps to the "release" GitHub Environment

    permissions:
      id-token: write       # required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token needed – PyPI uses the OIDC JWT issued above.
        # To publish to TestPyPI instead, uncomment:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
